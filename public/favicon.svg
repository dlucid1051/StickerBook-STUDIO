<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="fav-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <linearGradient id="fav-peel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  <!-- Die-cut sticker badge base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#ffffff" stroke="#e0e7ff" stroke-width="2" />
  <rect x="5" y="5" width="54" height="54" rx="13" fill="url(#fav-bg)" />
  
  <!-- Sticker Album Page Grid Accent -->
  <rect x="11" y="11" width="42" height="42" rx="9" fill="#ffffff" fill-opacity="0.2" />
  
  <!-- Die-cut vinyl star sticker -->
  <!-- White vinyl border -->
  <path d="M32 15 L36.2 24.8 L46.8 25.8 L38.8 33.1 L41.1 43.5 L32 38 L22.9 43.5 L25.2 33.1 L17.2 25.8 L27.8 24.8 Z" fill="#ffffff" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
  <!-- Radiant Vinyl Star -->
  <path d="M32 15 L36.2 24.8 L46.8 25.8 L38.8 33.1 L41.1 43.5 L32 38 L22.9 43.5 L25.2 33.1 L17.2 25.8 L27.8 24.8 Z" fill="url(#fav-star)" stroke="#f59e0b" stroke-width="0.8" stroke-linejoin="round" />
  
  <!-- Tactile Peel Effect on Corner -->
  <path d="M39 42.5 L44 37 L39 36 Z" fill="url(#fav-peel)" />

  <!-- Studio Sparkles -->
  <circle cx="49" cy="14" r="3.2" fill="#ffffff" />
  <circle cx="15" cy="47" r="2.2" fill="#ffffff" opacity="0.85" />
</svg>
