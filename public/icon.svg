<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="sticker-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.1" />
    </filter>
    <filter id="vinyl-lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="45%" stop-color="#8b5cf6" />
      <stop offset="80%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="planet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="heart-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="album-cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="peel-curl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Background circular squircle badge with vinyl sticker border -->
  <g filter="url(#sticker-shadow)">
    <!-- White die-cut outline -->
    <rect x="24" y="24" width="464" height="464" rx="112" fill="#ffffff" stroke="#e2e8f0" stroke-width="8" />
    <!-- Gradient Fill -->
    <rect x="44" y="44" width="424" height="424" rx="92" fill="url(#bg-grad)" />
    <!-- Glossy Highlight Overlay -->
    <path d="M 44 136 C 44 85 85 44 136 44 L 376 44 C 427 44 468 85 468 136 C 468 170 360 210 256 210 C 140 210 44 170 44 136 Z" fill="url(#gloss)" />
  </g>

  <!-- Open StickerBook Album & Creative Studio Canvas -->
  <g transform="translate(100, 100)">
    <!-- Album Binder Back Base -->
    <rect x="16" y="24" width="280" height="264" rx="28" fill="#4338ca" opacity="0.3" transform="rotate(-4 156 156)" />
    
    <!-- Open Album Page 1 (Underlying) -->
    <rect x="20" y="20" width="272" height="260" rx="24" fill="url(#album-cover)" stroke="#cbd5e1" stroke-width="6" />
    
    <!-- Subtle Album Grid Lines / Dot Matrix Pattern -->
    <g opacity="0.25">
      <line x1="48" y1="60" x2="264" y2="60" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="4 6" />
      <line x1="48" y1="100" x2="264" y2="100" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="4 6" />
      <line x1="48" y1="140" x2="264" y2="140" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="4 6" />
      <line x1="48" y1="180" x2="264" y2="180" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="4 6" />
      <line x1="48" y1="220" x2="264" y2="220" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="4 6" />
    </g>

    <!-- Spiral / Spine Binding Accent -->
    <g fill="#94a3b8" opacity="0.7">
      <rect x="24" y="52" width="10" height="18" rx="4" fill="#6366f1" />
      <rect x="24" y="92" width="10" height="18" rx="4" fill="#6366f1" />
      <rect x="24" y="132" width="10" height="18" rx="4" fill="#6366f1" />
      <rect x="24" y="172" width="10" height="18" rx="4" fill="#6366f1" />
      <rect x="24" y="212" width="10" height="18" rx="4" fill="#6366f1" />
    </g>

    <!-- Sticker 1: Die-Cut Vinyl Planet Sticker (Top Left) -->
    <g transform="translate(68, 56) rotate(-8)">
      <circle cx="28" cy="28" r="24" fill="#ffffff" />
      <circle cx="28" cy="28" r="20" fill="url(#planet-grad)" />
      <!-- Ring around planet -->
      <ellipse cx="28" cy="28" rx="30" ry="8" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" transform="rotate(-22 28 28)" />
      <ellipse cx="28" cy="28" rx="28" ry="6" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" transform="rotate(-22 28 28)" />
    </g>

    <!-- Sticker 2: Die-Cut Heart Sticker (Bottom Left) -->
    <g transform="translate(72, 168) rotate(6)">
      <path d="M24 8 C16 0 4 6 4 18 C4 28 16 38 24 44 C32 38 44 28 44 18 C44 6 32 0 24 8 Z" fill="#ffffff" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" />
      <path d="M24 8 C16 0 4 6 4 18 C4 28 16 38 24 44 C32 38 44 28 44 18 C44 6 32 0 24 8 Z" fill="url(#heart-grad)" />
    </g>

    <!-- Sticker 3: Main Tactile Die-Cut Vinyl Star Sticker with Peeling Corner -->
    <g filter="url(#vinyl-lift)" transform="translate(142, 92) rotate(10)">
      <!-- Thick Die-Cut White Vinyl Outline -->
      <path d="M52 10 L64 36 L92 38 L70 58 L77 86 L52 71 L27 86 L34 58 L12 38 L40 36 Z" 
            fill="#ffffff" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" />
      <!-- Radiant Star Fill -->
      <path d="M52 10 L64 36 L92 38 L70 58 L77 86 L52 71 L27 86 L34 58 L12 38 L40 36 Z" 
            fill="url(#star-grad)" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round" />
      <!-- Star Face / Sparkle Eye Details -->
      <circle cx="44" cy="46" r="4" fill="#451a03" />
      <circle cx="60" cy="46" r="4" fill="#451a03" />
      <path d="M48 54 Q52 58 56 54" fill="none" stroke="#451a03" stroke-width="3" stroke-linecap="round" />
      
      <!-- Peeling Sticker Corner Effect (Curled Backing) -->
      <path d="M70 72 L82 88 L64 86 Z" fill="url(#peel-curl)" stroke="#cbd5e1" stroke-width="1.5" />
    </g>

    <!-- Whimsical Studio Sparkles -->
    <path d="M260 40 L266 56 L282 62 L266 68 L260 84 L254 68 L238 62 L254 56 Z" fill="#fbbf24" stroke="#ffffff" stroke-width="3.5" />
    <path d="M42 248 L46 258 L56 261 L46 264 L42 274 L38 264 L28 261 L38 258 Z" fill="#ffffff" />
    <path d="M256 220 L260 228 L268 231 L260 234 L256 242 L252 234 L244 231 L252 228 Z" fill="#f43f5e" stroke="#ffffff" stroke-width="2" />
  </g>
</svg>
