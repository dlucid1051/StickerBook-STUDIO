<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="sticker-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.1" />
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>

  <!-- Background circular badge with sticker border -->
  <g filter="url(#sticker-shadow)">
    <!-- White die-cut outline -->
    <rect x="24" y="24" width="464" height="464" rx="112" fill="#ffffff" stroke="#e2e8f0" stroke-width="8" />
    <!-- Gradient Fill -->
    <rect x="44" y="44" width="424" height="424" rx="92" fill="url(#bg-grad)" />
    <!-- Glossy Highlight Overlay -->
    <path d="M 44 136 C 44 85 85 44 136 44 L 376 44 C 427 44 468 85 468 136 C 468 170 360 210 256 210 C 140 210 44 170 44 136 Z" fill="url(#gloss)" />
  </g>

  <!-- Playful Doodle Grid & Flashcard Illustration -->
  <g transform="translate(106, 106)">
    <!-- Back flashcard tilted -->
    <rect x="25" y="10" width="200" height="230" rx="28" fill="#fef08a" transform="rotate(-10 125 125)" stroke="#ffffff" stroke-width="8" />
    <!-- Front flashcard -->
    <rect x="50" y="35" width="200" height="230" rx="28" fill="#ffffff" stroke="#e0e7ff" stroke-width="6" />
    
    <!-- Brain Grid Dots & Connections -->
    <circle cx="100" cy="95" r="14" fill="#6366f1" />
    <circle cx="150" cy="95" r="14" fill="#a855f7" />
    <circle cx="200" cy="95" r="14" fill="#ec4899" />
    <circle cx="125" cy="145" r="14" fill="#3b82f6" />
    <circle cx="175" cy="145" r="14" fill="#10b981" />
    <circle cx="150" cy="195" r="14" fill="#f59e0b" />

    <!-- Connecting Grid Lines -->
    <path d="M 100 95 L 150 95 L 200 95 M 100 95 L 125 145 L 175 145 L 200 95 M 125 145 L 150 195 L 175 145 M 150 95 L 150 195" 
          stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 1" />

    <!-- Sparkle Stars -->
    <path d="M 230 40 L 235 55 L 250 60 L 235 65 L 230 80 L 225 65 L 210 60 L 225 55 Z" fill="#fbbf24" stroke="#ffffff" stroke-width="3" />
    <path d="M 50 190 L 53 200 L 63 203 L 53 206 L 50 216 L 47 206 L 37 203 L 47 200 Z" fill="#f43f5e" stroke="#ffffff" stroke-width="2" />
  </g>
</svg>
